[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaudit"
version = "0.9.0"
description = "Algebraic-invariant and zero-shot geometric cryptic-pocket detectors on the official CryptoBench receptor-only benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "GeoAudit maintainers" }]
keywords = [
  "computational-chemistry",
  "pocket-detection",
  "structural-biology",
  "deterministic-geometry",
  "cryptobench",
]
# A floor, not the lock. The exact versions that produced every frozen number
# are measured and recorded in ENVIRONMENT.json and pinned in requirements.txt;
# install from those to reproduce the tables bit for bit. An earlier revision
# pinned numpy==1.26.4 here, which segfaults on import under this interpreter
# and had to be removed from the machine -- so the declared environment was one
# a reader could not even start, let alone reproduce.
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Cheminformatics for the curated evidence dictionary (not needed for the pilot).
chem = ["rdkit>=2023.9"]
# Spectral oracles (anisotropic and ultrametric shear) need ARPACK.
spectral = ["scipy>=1.11"]
# Test/dev tooling.
test = ["pytest>=8", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/shaneraphel/gf4-allele-conditioned-chemistry"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
