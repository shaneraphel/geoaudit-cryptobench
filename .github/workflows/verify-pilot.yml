name: verify-pilot

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # scipy is required by the spectral (anisotropic shear) modes; without it
        # those tests silently degrade instead of running.
        run: pip install numpy==1.26.4 "scipy>=1.11"
      - name: Verify repository scope and benchmark claims
        run: make verify
      - name: Unit tests without external pocket tools
        run: make test
