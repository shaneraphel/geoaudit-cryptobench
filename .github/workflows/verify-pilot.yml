name: verify-pilot

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install numpy==1.26.4
      - name: Verify claims and quarantine digests
        run: make verify
      - name: Unit tests without external pocket tools
        run: make test
