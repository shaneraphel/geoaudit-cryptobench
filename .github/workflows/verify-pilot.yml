name: verify-pilot

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fifth fold read claims that the statistic it reports was
          # committed before the read. That claim is checked against git, not
          # believed from the artifact, so the commit it cites has to be in the
          # clone. A depth-1 checkout does not contain it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # scipy is required by the spectral (anisotropic shear) modes; without it
        # those tests silently degrade instead of running.
        run: pip install -r requirements.txt "scipy>=1.11"
      - name: Frozen artifacts must not contradict each other
        run: make consistency
      - name: Every published JSON must parse under a strict reader
        run: make strict-json
      - name: README results block must match the frozen JSON
        run: make readme
      - name: P2Rank raw archive must cover every scored unit and match its checksums
        run: make archive
      - name: Test-fold access ledger must match the artifacts on disk
        run: make ledger
      - name: Every frozen artifact must declare its role
        run: make artifacts
      - name: The headline must follow from the raw predictions, recomputed independently
        run: make recompute
      - name: The residue-identity rule and the recall denominator must not drift
        run: make residues
      - name: The published CryptoBench P2Rank row must reproduce under its own convention
        run: make published
      - name: The architecture choice must survive splits other than the one that chose it
        run: make crossval
      - name: The case studies must follow from the labels and the raw predictions
        run: make cases
      - name: The quotient counterattack must recompute its own capacity arithmetic
        run: make quotient
      - name: The gap diagnosis must still say capacity is not what binds
        run: make gap
      - name: The reported functional must still be the one chosen in advance
        run: make prereg
      - name: The fifth fold read must still cite the commit that fixed it
        run: make read5
      - name: Appendix A must still describe the modules it was generated from
        run: make wires
      - name: The generated invariant banks must match the modules that define them
        run: make banks
      - name: The quantisation sweep must be finished and must still be about the shipped constants
        run: make sens
      - name: Verify repository scope and benchmark claims
        run: make verify
      - name: Unit tests without external pocket tools
        run: make test
